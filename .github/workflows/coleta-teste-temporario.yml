name: Coleta de teste (temporário)
on:
  push:
    branches: [claude/project-thread-uo637r]
    paths: [.github/workflows/coleta-teste-temporario.yml]
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnóstico e coleta
        run: |
          mkdir -p out
          UA="HipertrofiaPesquisaBot/1.0 (+https://github.com/SamuelRomani/Hipertrofia; uso pessoal de pesquisa)"
          for u in /robots.txt /forum/forum/4-treinamento/ /forum/topic/269891-jiu-jitsu-e-treino/; do
            curl -sS -m 30 -A "$UA" -o "out/$(echo $u | tr / _).html" -D - "https://www.hipertrofia.org$u" | head -15 >> out/headers.txt 2>&1
            echo "-----" >> out/headers.txt
            sleep 2
          done
          timeout 600 python -m coletor.coletar --max-topicos 8 --max-paginas 1 > out/coleta.log 2>&1 || echo "saida $?" >> out/coleta.log
          python -m coletor.exportar >> out/coleta.log 2>&1 || true
          cp site/dados/topicos.json out/ 2>/dev/null || true
          sqlite3 dados/forum.db "select topico_id, posicao, post_id, autor, data, length(texto) from posts limit 30" > out/posts.txt 2>&1 || true
      - name: Publicar resultado no branch teste-coleta
        if: always()
        run: |
          cd out
          git init -q -b teste-coleta
          git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "resultado"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" teste-coleta
